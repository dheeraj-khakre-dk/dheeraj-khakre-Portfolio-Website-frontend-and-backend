name: Full-Stack CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  frontend-and-unit-tests:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Code Analysis
        run: npm run lint

      - name: Execute Automated Vitest Tests
        run: npm run test

      - name: Build Production Bundle & Server
        run: npm run build

  backend-spring-boot:
    name: Java Spring Boot 3 Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Spring Boot Maven Build
        working-directory: ./backend
        run: mvn -B clean compile -DskipTests

  docker-container-validation:
    name: Docker & Docker Compose Syntax Verification
    runs-on: ubuntu-latest
    needs: [frontend-and-unit-tests, backend-spring-boot]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Web Application Docker Image
        run: docker build -t dheeraj-portfolio-web:ci .
