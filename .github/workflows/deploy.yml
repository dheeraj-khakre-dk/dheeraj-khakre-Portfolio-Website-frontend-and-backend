name: Automated Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'deployment'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, Test & Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Type Checking & Linter
        run: npm run lint

      - name: Run Automated Vitest Test Suites
        run: npm run test

      - name: Compile Production Web Application Bundle
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to Production Environment
        id: deployment
        uses: actions/deploy-pages@v4
